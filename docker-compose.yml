# Только для локальной разработки: учебные креды, не использовать вне localhost.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: miniitsm
      POSTGRES_USER: miniitsm
      POSTGRES_PASSWORD: miniitsm
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miniitsm -d miniitsm"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
